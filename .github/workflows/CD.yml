name: CD

on:
  push:
    branches:
      - staging
      - main

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging'
    environment: staging
    steps:
      - name: Deploy to staging server
        uses: appleboy/ssh-action@dd404abe5e6b1c6d23c92e1a1b4ade1d1e17b2ef
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/social_badge_ui_staging
            git fetch origin
            PREVIOUS_COMMIT=$(git rev-parse HEAD)
            git reset --hard origin/staging
            echo "NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}" > .env.local
            pnpm install --frozen-lockfile
            pnpm build
            pm2 reload ~/ecosystem.config.js --only social_badge_ui_staging
            sleep 15
            if ! curl -f https://staging.social-badge.hng14.com/api/health; then
              git reset --hard $PREVIOUS_COMMIT
              pnpm install --frozen-lockfile
              pnpm build
              pm2 reload ~/ecosystem.config.js --only social_badge_ui_staging
              exit 1
            fi

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@dd404abe5e6b1c6d23c92e1a1b4ade1d1e17b2ef
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/social_badge_ui
            git fetch origin
            PREVIOUS_COMMIT=$(git rev-parse HEAD)
            git reset --hard origin/main
            echo "NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}" > .env.local
            pnpm install --frozen-lockfile
            pnpm build
            pm2 reload ~/ecosystem.config.js --only social_badge_ui
            sleep 15
            if ! curl -f https://social-badge.hng14.com/api/health; then
              git reset --hard $PREVIOUS_COMMIT
              pnpm install --frozen-lockfile
              pnpm build
              pm2 reload ~/ecosystem.config.js --only social_badge_ui
              exit 1
            fi
