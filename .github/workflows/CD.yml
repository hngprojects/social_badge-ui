name: CD

on:
  push:
    branches: [staging, main]

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging'
    environment: staging
    steps:
      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/social_badge_ui_staging
            git fetch origin
            git reset --hard origin/staging
            pnpm install --frozen-lockfile
            pnpm build
            pm2 reload ~/ecosystem.config.js --only social_badge_ui_staging

      - name: Health check
        run: |
          sleep 15
          curl -f https://staging.social-badge.hng14.com/api/health || exit 1

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/social_badge_ui
            git fetch origin
            git reset --hard origin/main
            pnpm install --frozen-lockfile
            pnpm build
            pm2 reload ~/ecosystem.config.js --only social_badge_ui

      - name: Health check
        run: |
          sleep 15
          curl -f https://social-badge.hng14.com/api/health || exit 1
